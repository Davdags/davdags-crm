<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DavDags CRM">
<title>DavDags CRM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

<section id="login" class="hidden">
  <form class="login-card" id="login-form">
    <img src="icons/icon-192.png" alt="">
    <h1>DavDags CRM</h1>
    <p>Your WhatsApp chats, leads, calls and clients.</p>
    <input class="field" id="password" type="password" placeholder="Password or agent code" autocomplete="current-password" required>
    <div style="height:12px"></div>
    <button class="btn primary" style="width:100%" type="submit">Log in</button>
    <div class="error" id="login-error" style="margin-top:10px"></div>
  </form>
</section>

<section id="app" class="hidden">
  <header class="top">
    <div class="brand"><img src="icons/icon-192.png" alt=""> DavDags CRM</div>
    <nav class="tabs" id="tabs"></nav>
    <div class="top-right">
      <span class="wide" id="sync"><span class="sync-dot"></span>Live</span>
      <button class="icon-btn" data-action="settings" title="Notifications & settings">⚙️</button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="bottom" id="bottom-nav"></nav>
</section>

<div id="overlay"></div>
<script src="calls.js?v=5"></script>
<script src="app.js?v=7"></script>
</body>
</html>
